services:
  image-splitter:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      - ENV_ID=testing
      - NODE_OPTIONS=--max-old-space-size=4096
    tty: true
    ports:
      - 8800:8800
    # mount folders to keep hot reload
    # while having node_modules installed in the container as it has linux dependencies
    volumes:
      - ./config:/app/config
      - ./migrations:/app/migrations
      - ./schema.graphql:/app/schema.graphql
      - ./src:/app/src
      - ./tmp:/app/tmp
    restart: always
    depends_on:
      postgres-test: # Wait for postgres-test to be healthy
        condition: service_healthy
      redis:
        condition: service_healthy
      minio: # Wait for minio to be healthy
        condition: service_healthy
      create-bucket: # Wait for the bucket creation task to complete
        condition: service_completed_successfully

  postgres-test:
    image: postgres:18
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: image_splitter
      # mirror production: Postgres session time zone is UTC
      TZ: UTC
      PGTZ: UTC
    mem_limit: 1G
    ports:
      - 5101:5432
    # throwaway data: tests start from an empty database every run
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d image_splitter"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s # Give it some time to start before checking

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    ports:
      - 19000:19000
      - 9001:9001
    environment:
      MINIO_ROOT_USER: minio-admin
      MINIO_ROOT_PASSWORD: minio-admin
    command: server /data --console-address :9001 --address :19000
    volumes:
      - ./test/minio:/data
    healthcheck:
      # Use curl to check the Minio health endpoint directly
      test: ["CMD", "curl", "-f", "http://localhost:19000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  create-bucket:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    container_name: create-minio-bucket
    environment:
      MINIO_HOST: minio
      MINIO_ACCESS_KEY: minio-admin
      MINIO_SECRET_KEY: minio-admin
    depends_on: # Make sure minio is healthy before trying to create bucket
      minio:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command: >
      set -e &&
      sleep 2 &&
      mc alias set --api S3v4 local http://minio:19000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY &&
      mc mb --ignore-existing local/gratheon-test &&
      mc anonymous set download local/gratheon-test

  redis:
    image: redis:8-alpine
    command: redis-server --requirepass pass
    ports:
      - 16379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "pass", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
